name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Ruff e pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formatação)
        run: ruff format --check .
      - name: Testes
        run: pytest
      - name: Pipeline reproduz as métricas do README
        if: hashFiles('data/exoplanetas.csv') != ''
        run: |
          python -m exoplanetas.pipeline
          git diff --exit-code -- reports/metricas.json
