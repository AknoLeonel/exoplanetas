name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Ruff e pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=concise .
      - name: Ruff (formatação)
        run: ruff format --diff .
      - name: Testes
        run: pytest --cov-report=xml
      - name: Pipeline reproduz as métricas do README e os dados do site
        if: hashFiles('data/exoplanetas.csv') != ''
        run: |
          python -m exoplanetas.pipeline
          git diff --exit-code -- reports/metricas.json site/public/dados
      - name: Cobertura do Python no Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  site-qualidade:
    name: Site, qualidade (Biome, tipos, arch-contract, Knip, commitlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Biome (lint e formatação)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: arch-contract (camadas)
        run: npm run arch
      - name: Knip (código e dependências sem uso)
        run: npm run knip
      - name: commitlint (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: npx commitlint --config commitlint.config.mjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  site-testes:
    name: Site, testes unitários e de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Vitest com cobertura
        run: npm run test:cobertura
      - name: Cobertura do site no Codecov
        uses: codecov/codecov-action@v5
        with:
          files: site/coverage/lcov.info
          flags: site
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  site-e2e:
    name: Site, ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright (build e prévia incluídos)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7

  site-mutacao:
    name: Site, testes de mutação (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'push'
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Stryker (nota mínima 80)
        run: npm run mutacao
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-de-mutacao
          path: site/reports/mutation
          retention-days: 7
