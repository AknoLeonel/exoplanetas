<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exoplanetas</title>
    <meta name="description" content="Laboratório de astrofísica: estude e explore exoplanetas, o Sistema Solar, análise de dados e machine learning com dados reais da NASA." />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Exoplanetas: laboratório de astrofísica" />
    <meta property="og:description" content="Passe o mouse sobre cada planeta, filtre por tamanho e veja como as descobertas aconteceram." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='8' fill='%232a78d6'/%3E%3Cellipse cx='16' cy='16' rx='15' ry='4.5' fill='none' stroke='%23eb6834' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E" />
    <script>
      // Aplica o tema escolhido antes da primeira pintura, para não piscar o tema errado.
      try {
        const tema = localStorage.getItem("tema");
        if (tema === "claro" || tema === "escuro") document.documentElement.dataset.tema = tema;
      } catch {
        // Sem armazenamento (janela privada): vale o tema do sistema.
      }
    </script>
    <link rel="stylesheet" href="/src/estilos/site.css" />
  </head>
  <body>
    <a class="pular" href="#principal" data-ancora="principal">Pular para o conteúdo</a>
    <div class="progresso-global" id="progresso-global" data-estado="oculto" aria-hidden="true"><span></span></div>

    <header class="topo">
      <nav aria-label="Módulos">
        <a class="marca" href="#/">Exoplanetas</a>
        <ul class="nav-modulos" id="nav-modulos"></ul>
        <button class="botao-tema" id="botao-tema" type="button" aria-label="Alternar entre tema claro e escuro">Tema</button>
        <a class="github" href="https://github.com/AknoLeonel/exoplanetas">GitHub</a>
      </nav>
    </header>

    <p class="so-leitor" id="anuncio" role="status" aria-live="polite"></p>
    <main id="principal" class="palco" tabindex="-1"></main>
    <template id="modelo-catalogo">
      <nav class="subnav" aria-label="Nesta página">
        <a href="#explorar" data-ancora="explorar">Explorar</a>
        <a href="#descobertas" data-ancora="descobertas">Descobertas</a>
        <a href="#modelo" data-ancora="modelo">Modelo</a>
        <a href="#terra" data-ancora="terra">Parecidos com a Terra</a>
      </nav>
      <section class="hero" aria-labelledby="titulo">
        <h1 id="titulo">Os mundos além do Sol</h1>
        <p class="lead">
          Todos os planetas confirmados fora do Sistema Solar, do NASA Exoplanet Archive. Passe o mouse sobre cada um,
          filtre por tamanho e veja como a caça aos exoplanetas aconteceu.
        </p>
        <div class="host-resumo" data-secao="resumo" aria-live="polite" aria-busy="true">
          <div class="cartoes" data-skeleton>
          <div class="cartao skeleton-grupo"><div class="skeleton texto" style="width: 50%"></div><div class="skeleton" style="height: 32px; width: 70%"></div><div class="skeleton texto" style="width: 85%"></div></div>
          <div class="cartao skeleton-grupo"><div class="skeleton texto" style="width: 50%"></div><div class="skeleton" style="height: 32px; width: 70%"></div><div class="skeleton texto" style="width: 85%"></div></div>
          <div class="cartao skeleton-grupo"><div class="skeleton texto" style="width: 50%"></div><div class="skeleton" style="height: 32px; width: 70%"></div><div class="skeleton texto" style="width: 85%"></div></div>
          <div class="cartao skeleton-grupo"><div class="skeleton texto" style="width: 50%"></div><div class="skeleton" style="height: 32px; width: 70%"></div><div class="skeleton texto" style="width: 85%"></div></div>
        </div>
        </div>
      </section>

      <section class="secao" id="explorar" aria-labelledby="t-explorar">
        <header>
          <h2 id="t-explorar">Período × raio: onde estão os planetas</h2>
          <p>
            Cada ponto cheio é um planeta que passou na frente da estrela, o único jeito de medir o raio direto. Os
            pontos vazados, se você os incluir, têm o raio estimado a partir da massa. Repare no vazio laranja:
            planetas do tamanho de Netuno quase não existem em órbitas de poucos dias.
          </p>
        </header>
        <div class="painel" data-secao="explorador" aria-busy="true">
          <div data-skeleton>
            <div class="skeleton-grupo filtros"><div class="skeleton linha"></div><div class="skeleton linha"></div><div class="skeleton linha"></div><div class="skeleton linha"></div><div class="skeleton linha"></div></div>
            <div class="skeleton bloco-grafico" style="margin-top: 16px"></div>
            <div class="skeleton bloco-tabela" style="margin-top: 28px"></div>
            <div class="progresso-secao" data-indeterminado><span></span></div>
          </div>
        </div>
      </section>

      <section class="secao" id="descobertas" aria-labelledby="t-descobertas">
        <header>
          <h2 id="t-descobertas">Descobertas por ano</h2>
          <p>Do primeiro planeta confirmado até hoje. Os picos são validações em massa de candidatos do telescópio Kepler.</p>
        </header>
        <div class="painel" data-secao="descobertas" aria-busy="true">
          <div data-skeleton>
            <div class="skeleton bloco-barras"></div>
            <div class="progresso-secao" data-indeterminado><span></span></div>
          </div>
        </div>
      </section>

      <section class="secao" id="modelo" aria-labelledby="t-modelo">
        <header>
          <h2 id="t-modelo">Estimando o tamanho de um planeta</h2>
          <p>
            Dá para prever o raio de um planeta a partir da massa, do período e da estrela? O modelo foi avaliado em
            planetas de uma estrela que ele nunca viu no treino.
          </p>
        </header>
        <div data-secao="modelo" aria-busy="true">
          <div data-skeleton class="grade-2">
            <div class="painel"><div class="skeleton bloco-lista"></div></div>
            <div class="painel"><div class="skeleton bloco-lista"></div></div>
          </div>
        </div>
      </section>

      <section class="secao" id="terra" aria-labelledby="t-terra">
        <header>
          <h2 id="t-terra">Os mais próximos que lembram a Terra</h2>
          <p>Planetas pequenos, de raio medido (provavelmente rochosos), que recebem uma luz parecida com a que a Terra recebe.</p>
        </header>
        <div data-secao="terra" aria-busy="true">
          <div data-skeleton class="lista-terra">
            <div class="skeleton" style="height: 128px"></div><div class="skeleton" style="height: 128px"></div><div class="skeleton" style="height: 128px"></div>
          </div>
        </div>
      </section>
        </template>
    <noscript><p class="sem-js">Este site precisa de JavaScript para mostrar os gráficos interativos. Os mesmos resultados estão no <a href="https://github.com/AknoLeonel/exoplanetas#readme">README do projeto</a>.</p></noscript>


    <footer class="rodape">
      Fonte: <a href="https://exoplanetarchive.ipac.caltech.edu">NASA Exoplanet Archive</a>, tabela <code>pscomppars</code>.
      <span id="coleta"></span>
      Código e análise em <a href="https://github.com/AknoLeonel/exoplanetas">AknoLeonel/exoplanetas</a>.
    </footer>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
