[project]
name = "exoplanetas"
version = "1.0.0"
description = "Análise e Machine Learning com os exoplanetas confirmados do NASA Exoplanet Archive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Medição própria de trânsitos (src/exoplanetas/medicao.py). O download das curvas usa também o lightkurve.
medicao = ["astropy>=6.0", "batman-package>=2.5", "scipy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=exoplanetas --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e "×" em textos em português

[tool.ruff.lint.per-file-ignores]
"src/exoplanetas/graficos.py" = ["E402"]  # matplotlib.use antes do pyplot
